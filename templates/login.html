{% extends 'base.html' %}

{% block content %}
<div class="w-full max-w-md glass-card p-8 rounded-3xl relative overflow-hidden group">
    <!-- Ornamen Lingkaran Planet di latar belakang kartu -->
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-cyan-500 rounded-full mix-blend-multiply filter blur-2xl opacity-20 group-hover:opacity-40 transition-opacity duration-500"></div>
    <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-purple-500 rounded-full mix-blend-multiply filter blur-2xl opacity-20 group-hover:opacity-40 transition-opacity duration-500"></div>

    <div class="relative z-10">
        <h2 class="text-3xl font-bold text-center text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400 mb-2">Portal Akses</h2>
        <p class="text-center text-gray-400 text-sm mb-8">Silakan identifikasi diri Anda, Komandan.</p>

        <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-cyan-200 mb-1">ID Komunikasi (Username)</label>
                <input type="text" id="username" name="username" required
                    class="w-full bg-white/5 border border-gray-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all duration-300 placeholder-gray-500"
                    placeholder="Masukkan username...">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-cyan-200 mb-1">Kode Akses (Password)</label>
                <input type="password" id="password" name="password" required
                    class="w-full bg-white/5 border border-gray-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all duration-300 placeholder-gray-500"
                    placeholder="Masukkan password...">
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-xl transition-all duration-300 shadow-[0_0_20px_rgba(6,182,212,0.4)] hover:shadow-[0_0_30px_rgba(6,182,212,0.7)] flex justify-center items-center gap-2">
                <span>LAUNCH</span> 🚀
            </button>
        </form>

        <!-- Info Akun Dummy untuk Testing -->
        <div class="mt-8 pt-6 border-t border-gray-700/50 text-gray-400 text-sm text-center">
            <!-- Add your dummy info here -->
        </div>
    </div>
</div>
{% endblock %}
